name: Build MIPS Softfloat

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: messense/rust-musl-cross:mipsel-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with softfloat flags
        run: |
          RUSTFLAGS="-C target-feature=+soft-float" CFLAGS="-msoft-float" cargo build --release --target mipsel-unknown-linux-musl

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-tls-mipsel-softfloat
          path: target/mipsel-unknown-linux-musl/release/shadow-tls
