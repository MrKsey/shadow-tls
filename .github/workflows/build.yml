name: Build MIPS Softfloat

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: mipsel-unknown-linux-gnu

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu

      - name: Build for MIPS LE
        run: |
          cargo build --release --target mipsel-unknown-linux-gnu

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-tls-mipsel-softfloat
          path: target/mipsel-unknown-linux-gnu/release/shadow-tls
