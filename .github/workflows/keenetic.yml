name: Build Keenetic MIPSLE Softfloat

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой
  release:
    types: [published]

jobs:
  build-keenetic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MIPS cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu
        
      - name: Install musl cross-compiler for MIPS
        run: |
          wget -q https://musl.cc/mipsel-linux-musl-cross.tgz
          tar xzf mipsel-linux-musl-cross.tgz
          echo "$PWD/mipsel-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Build with softfloat ABI
        run: |
          cargo build --release --target ./.mipsel-softfloat.json

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-tls-keenetic-mipsel-softfloat
          path: target/mipsel-unknown-linux-musl/release/shadow-tls
